[project]
name = "receipts"
version = "0.1.0"
description = "Check an AI research report: is every quote on the page it cites, and does every link exist?"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pypdf>=4.0",
]

[project.scripts]
receipts = "receipts.cli:main"

[project.optional-dependencies]
support = [
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "torch>=2.4",
    "transformers>=4.45",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
